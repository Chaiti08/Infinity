<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#04060f" />
    <title>The Infinity Gauntlet</title>
    <meta
      name="description"
      content="An interactive 3D Infinity Gauntlet. Drag the six stones into the gauntlet and watch reality bend."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='14' fill='%23ffc61a'/%3E%3Ccircle cx='32' cy='32' r='26' fill='none' stroke='%23d9a54e' stroke-width='6'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <canvas id="trail" aria-hidden="true"></canvas>

    <header class="brand">
      <h1>Infinity</h1>
      <p>Six stones. One gauntlet.</p>
    </header>

    <nav class="tools" aria-label="Controls">
      <button id="mute" class="icon-btn" aria-pressed="false" aria-label="Mute sound" title="Sound (M)">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4z" />
          <path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" />
          <path class="x" d="M16 9l5 6M21 9l-5 6" />
        </svg>
      </button>
      <button id="reset" class="icon-btn" aria-label="Reset" title="Reset (R)">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 12a8 8 0 1 0 2.4-5.7" />
          <path d="M4 4v4.5h4.5" />
        </svg>
      </button>
    </nav>

    <section id="tray" aria-label="Stones placed">
      <div class="pips"></div>
      <div class="meta"><span id="count">0 / 6</span><span id="hint">Drag a stone into the gauntlet</span></div>
    </section>

    <div id="caption" aria-live="polite"><span class="name"></span><span class="fx"></span></div>
    <div id="tooltip" role="tooltip"><span class="name"></span><span class="line"></span></div>
    <div id="message" aria-live="polite"><h2></h2><p></p></div>
    <button id="snap" tabindex="-1">
      <span class="ring"></span>
      <span class="label">Snap</span>
    </button>

    <footer class="credit">Fan-made tribute · not affiliated with Marvel · keys 1–6 place stones</footer>

    <div id="loader">
      <div class="emblem">
        <i style="--c: #2f7dff; --i: 0"></i><i style="--c: #ffc61a; --i: 1"></i><i style="--c: #ff1a2e; --i: 2"></i>
        <i style="--c: #a23bff; --i: 3"></i><i style="--c: #22ff6b; --i: 4"></i><i style="--c: #ff8a1a; --i: 5"></i>
      </div>
      <div class="label">Forging the gauntlet</div>
      <div class="bar"><i></i></div>
    </div>

    <noscript><p class="noscript">This experience needs JavaScript and WebGL.</p></noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
